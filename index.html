<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catholic Money Course: Featured Podcast Episodes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{--green:#006A42;--green2:#2D6845;--panel:#F4F4F4;--pink:#E86F6B;--text:#3f4042;--muted:#6b6c6e}
  *{box-sizing:border-box}
  body{margin:0;font-family:Lato,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.45}
  header{background:var(--green);color:#fff;padding:22px 20px 26px;text-align:center}
  .logo{display:inline-block;background:var(--panel);border-radius:14px;padding:10px 16px}
  .logo img{width:170px;height:auto;display:block}
  header h1{font-size:24px;margin:16px 0 4px;font-weight:900}
  header p{margin:0;font-size:16px;opacity:.92}
  main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
  .join{display:block;text-align:center;background:var(--pink);color:#fff;font-weight:900;font-size:18px;text-decoration:none;border-radius:999px;padding:14px 18px;margin:4px 0 6px}
  .joinnote{text-align:center;font-size:14px;color:var(--muted);margin:0 0 20px}
  .notice{background:#FFF4E5;border:1px solid #F3C98B;border-radius:12px;padding:14px 16px;margin:0 0 18px;font-size:16px}
  .ep{border:2px solid #e3e5e4;border-radius:16px;padding:16px;margin:0 0 16px;background:#fff;scroll-margin-top:12px}
  .ep.hl{border-color:var(--green);box-shadow:0 0 0 4px rgba(0,106,66,.12)}
  .when{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--pink);font-weight:700;margin:0 0 4px}
  .ep h2{font-size:21px;margin:0 0 4px;color:var(--green);line-height:1.2}
  .show{font-size:14px;color:var(--muted);margin:0 0 10px}
  .ep p.desc{margin:0 0 12px;font-size:16px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btns a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;color:#fff;background:var(--green2);border-radius:10px;padding:11px 8px}
  .btns a:only-child{grid-column:1/-1}
  .empty{text-align:center;color:var(--muted);font-size:16px;padding:10px 0 20px}
  footer{text-align:center;font-size:13px;color:var(--muted);padding:0 16px 30px}
</style>
</head>

        <p class="when">${esc(e.weekend)}</p>
        <h2>${esc(e.title)}</h2>
        <p class="show">The Catholic Money Show podcast</p>
        <p class="desc">${esc(e.desc)}</p>
        <div class="btns">${e.links.map(([n,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${n === "YouTube" ? "Watch on" : "Listen on"} ${esc(n)}</a>`).join("")}</div>
      </section>`).join("");
  }

  const el = target && document.getElementById("ep-" + target.id);
  if (el) el.scrollIntoView({block: "start"});
}
render();
window.addEventListener("hashchange", render);
</script>
</body>
</html>
